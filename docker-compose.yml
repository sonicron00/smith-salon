services:
  smith-salon-app:
    build:
      context: .
      dockerfile: docker/application/Dockerfile
    container_name: smith-salon-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - smith-salon-db
    ports:
      - "5173:5173"
    networks:
      - frontend
      - backend

  smith-salon-web:
    image: nginx:1.27-alpine
    container_name: smith-salon-web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - smith-salon-app
    networks:
      - frontend

  smith-salon-db:
    image: mysql:8.0.36
    container_name: smith-salon-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_DATABASE: app
    ports:
      - '33064:3306'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  smith-salon-worker:
    build:
      context: .
      dockerfile: docker/application/Dockerfile
    container_name: smith-salon-worker
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - smith-salon-db
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    restart: unless-stopped
    networks:
      - backend

  smith-salon-scheduler:
    build:
      context: .
      dockerfile: docker/application/Dockerfile
    container_name: smith-salon-scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - smith-salon-db
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    restart: unless-stopped
    networks:
      - backend

volumes:
  db_data:

networks:
  frontend:
  backend: